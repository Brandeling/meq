[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meq-session"
version = "0.1.0"
description = "Measure and allocate Claude Code and Codex session usage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Brandeling"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
meq = "meq.cli:main"

[tool.setuptools.packages.find]
include = ["meq*"]
